<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Engine Pro v5.0</title>
  <style>
    :root {
      --bg: #070a11;
      --bg-elev: #0e1322;
      --panel: #121a2d;
      --panel-border: #24304f;
      --text: #dce7ff;
      --muted: #8fa6d6;
      --accent: #00f2ff;
      --accent-2: #7d7bff;
      --good: #21e77d;
      --warn: #ff6b8f;
      --shadow: rgba(0, 0, 0, 0.35);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(0, 242, 255, 0.1), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(125, 123, 255, 0.15), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
      min-height: 100vh;
    }

    .app-container {
      width: min(1440px, 96vw);
      margin: 24px auto;
      padding: 18px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      background: linear-gradient(170deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      box-shadow: 0 20px 70px var(--shadow);
      backdrop-filter: blur(8px);
    }

    h2 {
      margin: 8px 0 14px;
      font-size: clamp(1rem, 2vw, 1.35rem);
      letter-spacing: 0.08em;
      color: var(--accent);
      text-shadow: 0 0 14px rgba(0, 242, 255, 0.25);
    }

    .sidebar-layout {
      display: grid;
      grid-template-columns: minmax(290px, 350px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .controls-panel,
    .media-panel {
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(18, 26, 45, 0.95), rgba(14, 20, 36, 0.96));
      padding: 14px;
    }

    .controls-panel {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 48px);
      overflow: auto;
    }

    .control-item {
      margin-bottom: 12px;
    }

    .split-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    select,
    input,
    button {
      width: 100%;
      background: #0b1120;
      border: 1px solid #2a3658;
      color: var(--text);
      padding: 10px 11px;
      border-radius: 9px;
      outline: none;
      transition: 160ms ease;
    }

    input[type="range"] {
      accent-color: var(--accent);
      padding: 0;
    }

    select:focus,
    input:focus,
    button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.15);
    }

    button {
      cursor: pointer;
      background: linear-gradient(180deg, #172342, #101a32);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    button:hover {
      border-color: #3a4f7a;
      transform: translateY(-1px);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    canvas {
      display: block;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #253150;
      background: #000;
    }

    #emojiCanvas {
      min-height: 380px;
      image-rendering: pixelated;
    }

    #visualizerCanvas {
      height: 140px;
      margin-top: 12px;
    }

    .status-line {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid #2d3c61;
      padding: 2px 8px;
      border-radius: 100px;
      background: #111933;
    }

    .warning {
      color: var(--warn);
      font-size: 0.74rem;
      margin-top: 5px;
      display: none;
    }

    .subsection {
      border-top: 1px dashed #2a3658;
      margin-top: 10px;
      padding-top: 10px;
    }

    video {
      display: none;
    }

    @media (max-width: 980px) {
      .sidebar-layout {
        grid-template-columns: 1fr;
      }

      .controls-panel {
        position: static;
        max-height: none;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>&gt; EMOJI_ENGINE_PRO_v5.0</h2>

    <div class="sidebar-layout">
      <div class="controls-panel">
        <div class="control-item">
          <label for="videoUpload">Video Source</label>
          <input type="file" id="videoUpload" accept="video/*" />
        </div>

        <div class="control-item">
          <label for="resSlider">Pixel Density: <span id="resLabel">12px</span></label>
          <input type="range" id="resSlider" min="4" max="50" step="2" value="12" />
          <div id="resWarning" class="warning">⚠ 4px mode can be heavy on slower devices.</div>
        </div>

        <div class="control-item">
          <label for="emojiMode">Mapping Algorithm</label>
          <select id="emojiMode">
            <option value="full">FULL_EMOJI_MATRIX ⚠ (heavy)</option>
            <option value="ascii">ASCII_CLASSIC</option>
            <option value="bw">BINARY_SQUARES</option>
            <option value="glitch">GLITCH_CORE</option>
            <option value="thermal">THERMAL_SIGHT</option>
            <option value="ascii_blur">ASCII_BLUR</option>
          </select>
        </div>

        <div class="control-item">
          <label for="colorProfile">Color Profile</label>
          <select id="colorProfile">
            <option value="source">SOURCE</option>
            <option value="matrix">MATRIX</option>
            <option value="cyber">CYBER</option>
            <option value="mono">MONO</option>
          </select>
        </div>

        <div class="button-row">
          <button id="playBtn" type="button">RUN</button>
          <button id="exportBtn" type="button">EXPORT PNG</button>
          <button id="fullscreenBtn" type="button">FULLSCREEN</button>
        </div>

        <div class="subsection">
          <div class="control-item split-2">
            <button id="toggleAudioSource" type="button">Use Video Audio</button>
            <button id="toggleRainbow" type="button">Rainbow OFF</button>
          </div>

          <div class="control-item">
            <label for="audioUpload">Audio Source</label>
            <input type="file" id="audioUpload" accept="audio/*" />
          </div>

          <div class="control-item split-2">
            <div>
              <label for="visColor">Visualizer Color</label>
              <input type="color" id="visColor" value="#00f2ff" />
            </div>
            <div>
              <label for="visType">Visualizer Type</label>
              <select id="visType">
                <option value="bars">Bars</option>
                <option value="wave">Wave</option>
              </select>
            </div>
          </div>

          <div class="control-item">
            <label for="rainbowSpeed">Rainbow Speed</label>
            <input type="range" id="rainbowSpeed" min="1" max="30" value="8" />
          </div>

          <div class="control-item split-2">
            <div>
              <label for="bassGain">Bass</label>
              <input type="range" id="bassGain" min="0" max="2" step="0.1" value="1" />
            </div>
            <div>
              <label for="midGain">Mid</label>
              <input type="range" id="midGain" min="0" max="2" step="0.1" value="1" />
            </div>
          </div>

          <div class="control-item">
            <label for="trebleGain">Treble</label>
            <input type="range" id="trebleGain" min="0" max="2" step="0.1" value="1" />
          </div>

          <div class="control-item split-2">
            <div>
              <label for="warmthGain">Warmth 120Hz</label>
              <input type="range" id="warmthGain" min="-12" max="12" step="1" value="0" />
            </div>
            <div>
              <label for="mudGain">Reduce Mud 350Hz</label>
              <input type="range" id="mudGain" min="-12" max="12" step="1" value="0" />
            </div>
          </div>

          <div class="control-item split-2">
            <div>
              <label for="presenceGain">Presence 2.5kHz</label>
              <input type="range" id="presenceGain" min="-12" max="12" step="1" value="0" />
            </div>
            <div>
              <label for="airGain">Air 8kHz</label>
              <input type="range" id="airGain" min="-12" max="12" step="1" value="0" />
            </div>
          </div>
        </div>
      </div>

      <div class="media-panel">
        <canvas id="emojiCanvas"></canvas>
        <video id="video" playsinline></video>
        <audio id="audioPlayer" crossorigin="anonymous"></audio>
        <canvas id="visualizerCanvas"></canvas>

        <div class="status-line">
          <span class="pill" id="modeState">Mode: idle</span>
          <span class="pill" id="fpsState">FPS: --</span>
          <span class="pill" id="resState">Internal: --</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const video = $("video");
    const audioPlayer = $("audioPlayer");
    const canvas = $("emojiCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const visCanvas = $("visualizerCanvas");
    const vCtx = visCanvas.getContext("2d");

    const upload = $("videoUpload");
    const audioUpload = $("audioUpload");
    const resSlider = $("resSlider");
    const resLabel = $("resLabel");
    const resWarning = $("resWarning");
    const emojiMode = $("emojiMode");
    const colorProfile = $("colorProfile");
    const playBtn = $("playBtn");
    const exportBtn = $("exportBtn");
    const fullscreenBtn = $("fullscreenBtn");
    const modeState = $("modeState");
    const fpsState = $("fpsState");
    const resState = $("resState");

    const toggleRainbow = $("toggleRainbow");
    const rainbowSpeed = $("rainbowSpeed");
    const toggleAudioSource = $("toggleAudioSource");
    const visType = $("visType");
    const visColor = $("visColor");

    const bassGain = $("bassGain");
    const midGain = $("midGain");
    const trebleGain = $("trebleGain");
    const warmthGain = $("warmthGain");
    const mudGain = $("mudGain");
    const presenceGain = $("presenceGain");
    const airGain = $("airGain");

    let isPlaying = false;
    let usingVideoAudio = true;
    let rainbowEnabled = false;
    let audioSourceEl = null;

    const MAX_INTERNAL_WIDTH = 560;
    const TARGET_FPS = 30;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;

    const ASCII_SET = Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i));
    const BW_SET = ["⬛", "⬜"];
    const GLITCH_SET = ["?", "!", "@", "#", "$", "%", "X", "0", "1"];
    const THERMAL_SET = ["🟦", "🟩", "🟨", "🟧", "🟥"];
    const FULL_SET = ["⬛", "⬜", "🟥", "🟧", "🟨", "🟩", "🟦", "🔥", "✨", "🌑", "🌕"];

    const offCanvas = document.createElement("canvas");
    const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

    let currentFontSize = 0;
    let lastRenderWidth = 0;
    let lastRenderHeight = 0;
    let lastTime = 0;
    let fpsTimer = 0;
    let frameCount = 0;

    upload.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      video.src = URL.createObjectURL(file);
      video.load();

      video.onloadedmetadata = () => {
        const scale = Math.min(1, MAX_INTERNAL_WIDTH / video.videoWidth);

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        offCanvas.width = Math.max(1, Math.floor(video.videoWidth * scale));
        offCanvas.height = Math.max(1, Math.floor(video.videoHeight * scale));

        visCanvas.width = canvas.width;
        visCanvas.height = 140;

        modeState.textContent = `Mode: ${emojiMode.value}`;
        resState.textContent = `Internal: ${offCanvas.width}x${offCanvas.height}`;
      };
    });

    audioUpload.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      audioPlayer.src = URL.createObjectURL(file);
      usingVideoAudio = false;
      toggleAudioSource.textContent = "Use Video Audio";
      connectSource(audioPlayer);
      audioPlayer.play().catch(() => {});
    });

    resSlider.addEventListener("input", () => {
      resLabel.textContent = `${resSlider.value}px`;
      resWarning.style.display = Number(resSlider.value) <= 4 ? "block" : "none";
    });

    emojiMode.addEventListener("change", () => {
      modeState.textContent = `Mode: ${emojiMode.value}`;
    });

    function pickChar(norm, mode) {
      switch (mode) {
        case "ascii":
        case "ascii_blur":
          return ASCII_SET[Math.floor(norm * (ASCII_SET.length - 1))];
        case "bw":
          return norm > 0.5 ? BW_SET[1] : BW_SET[0];
        case "glitch": {
          const idx = Math.floor(Math.abs((norm + Math.random() * 0.25) % 1) * (GLITCH_SET.length - 1));
          return GLITCH_SET[idx];
        }
        case "thermal":
          return norm < 0.2 ? THERMAL_SET[0]
            : norm < 0.4 ? THERMAL_SET[1]
            : norm < 0.6 ? THERMAL_SET[2]
            : norm < 0.8 ? THERMAL_SET[3]
            : THERMAL_SET[4];
        default:
          return FULL_SET[Math.floor(norm * (FULL_SET.length - 1))];
      }
    }

    function pickColor(r, g, b, bright) {
      switch (colorProfile.value) {
        case "matrix":
          return `rgb(0,${bright | 0},0)`;
        case "cyber":
          return `rgb(${bright | 0},0,${(bright * 0.6) | 0})`;
        case "mono":
          return `rgb(${bright | 0},${bright | 0},${bright | 0})`;
        default:
          return `rgb(${r},${g},${b})`;
      }
    }

    function render(size) {
      if (!video.videoWidth) return;

      if (size <= 6 && emojiMode.value === "full") emojiMode.value = "ascii";

      const scale = Math.min(1, MAX_INTERNAL_WIDTH / video.videoWidth);
      const internalWidth = Math.floor(video.videoWidth * scale);
      const internalHeight = Math.floor(video.videoHeight * scale);
      const cols = Math.max(1, Math.floor(internalWidth / size));
      const rows = Math.max(1, Math.floor(internalHeight / size));

      if (offCanvas.width !== cols || offCanvas.height !== rows) {
        offCanvas.width = cols;
        offCanvas.height = rows;
        resState.textContent = `Internal: ${cols}x${rows}`;
      }

      offCtx.drawImage(video, 0, 0, cols, rows);
      const imageData = offCtx.getImageData(0, 0, cols, rows);
      const data = imageData.data;

      const cellWidth = canvas.width / cols;
      const cellHeight = canvas.height / rows;
      const fontSize = Math.max(8, Math.floor(cellHeight));

      if (fontSize !== currentFontSize) {
        ctx.font = `${fontSize}px monospace`;
        ctx.textBaseline = "top";
        currentFontSize = fontSize;
      }

      const blurMode = emojiMode.value === "ascii_blur";
      ctx.globalAlpha = blurMode ? 0.35 : 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0, px = 0; i < cols * rows; i++, px += 4) {
        const x = i % cols;
        const y = (i / cols) | 0;

        const r = data[px];
        const g = data[px + 1];
        const b = data[px + 2];

        const bright = r * 0.299 + g * 0.587 + b * 0.114;
        const norm = bright / 255;

        const char = pickChar(norm, emojiMode.value);
        ctx.fillStyle = pickColor(r, g, b, bright);
        ctx.fillText(char, x * cellWidth, y * cellHeight);
      }

      ctx.globalAlpha = 1;
    }

    function exportFrame() {
      const a = document.createElement("a");
      a.download = `emoji-engine-${Date.now()}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    function resizeCanvasToDisplay() {
      if (!video.videoWidth) return;
      const w = canvas.clientWidth;
      const aspect = video.videoHeight / video.videoWidth;
      const h = Math.max(220, Math.floor(w * aspect));
      if (w !== lastRenderWidth || h !== lastRenderHeight) {
        canvas.width = w;
        canvas.height = h;
        visCanvas.width = w;
        lastRenderWidth = w;
        lastRenderHeight = h;
      }
    }

    function engineLoop(timestamp) {
      if (timestamp - lastTime >= FRAME_INTERVAL) {
        resizeCanvasToDisplay();
        if (isPlaying && !video.paused && !video.ended) {
          render(Number(resSlider.value));
          frameCount += 1;
        }
        lastTime = timestamp;
      }

      if (timestamp - fpsTimer >= 1000) {
        fpsState.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        fpsTimer = timestamp;
      }

      requestAnimationFrame(engineLoop);
    }

    let audioCtx;
    let analyser;
    let source;
    let dataArray;

    let bassFilter, midFilter, trebleFilter;
    let warmthFilter, mudFilter, presenceFilter, airFilter;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    function connectSource(mediaElement) {
      initAudio();
      if (source) source.disconnect();

      source = audioCtx.createMediaElementSource(mediaElement);
      audioSourceEl = mediaElement;

      warmthFilter = audioCtx.createBiquadFilter();
      warmthFilter.type = "lowshelf";
      warmthFilter.frequency.value = 120;

      mudFilter = audioCtx.createBiquadFilter();
      mudFilter.type = "peaking";
      mudFilter.frequency.value = 350;
      mudFilter.Q.value = 1.2;

      presenceFilter = audioCtx.createBiquadFilter();
      presenceFilter.type = "peaking";
      presenceFilter.frequency.value = 2500;
      presenceFilter.Q.value = 1.0;

      airFilter = audioCtx.createBiquadFilter();
      airFilter.type = "highshelf";
      airFilter.frequency.value = 8000;

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = "lowshelf";
      bassFilter.frequency.value = 200;

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = "peaking";
      midFilter.frequency.value = 1000;

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = "highshelf";
      trebleFilter.frequency.value = 3000;

      source
        .connect(warmthFilter)
        .connect(mudFilter)
        .connect(presenceFilter)
        .connect(airFilter)
        .connect(bassFilter)
        .connect(midFilter)
        .connect(trebleFilter)
        .connect(analyser)
        .connect(audioCtx.destination);

      updateEQ();
    }

    function updateEQ() {
      if (!bassFilter) return;
      bassFilter.gain.value = bassGain.value * 10 - 10;
      midFilter.gain.value = midGain.value * 10 - 10;
      trebleFilter.gain.value = trebleGain.value * 10 - 10;

      warmthFilter.gain.value = warmthGain.value;
      mudFilter.gain.value = mudGain.value;
      presenceFilter.gain.value = presenceGain.value;
      airFilter.gain.value = airGain.value;
    }

    [bassGain, midGain, trebleGain, warmthGain, mudGain, presenceGain, airGain].forEach((s) => {
      s.addEventListener("input", updateEQ);
    });

    function visStrokeStyle(t) {
      if (!rainbowEnabled) return visColor.value;
      const hue = ((t / 16) * Number(rainbowSpeed.value)) % 360;
      return `hsl(${hue} 100% 60%)`;
    }

    function drawVisualizer(t = 0) {
      const w = visCanvas.width;
      const h = visCanvas.height;

      vCtx.fillStyle = "rgba(0,0,0,0.35)";
      vCtx.fillRect(0, 0, w, h);

      if (analyser && dataArray) {
        const stroke = visStrokeStyle(t);

        if (visType.value === "wave") {
          analyser.getByteTimeDomainData(dataArray);
          vCtx.beginPath();
          vCtx.lineWidth = 2;
          vCtx.strokeStyle = stroke;
          for (let i = 0; i < dataArray.length; i++) {
            const x = (i / dataArray.length) * w;
            const y = (dataArray[i] / 255) * h;
            i === 0 ? vCtx.moveTo(x, y) : vCtx.lineTo(x, y);
          }
          vCtx.stroke();
        } else {
          analyser.getByteFrequencyData(dataArray);
          const barWidth = Math.max(2, w / dataArray.length - 1);
          vCtx.fillStyle = stroke;
          for (let i = 0; i < dataArray.length; i++) {
            const val = dataArray[i];
            const barH = (val / 255) * h;
            vCtx.fillRect(i * (barWidth + 1), h - barH, barWidth, barH);
          }
        }
      }

      requestAnimationFrame(drawVisualizer);
    }

    toggleRainbow.addEventListener("click", () => {
      rainbowEnabled = !rainbowEnabled;
      toggleRainbow.textContent = rainbowEnabled ? "Rainbow ON" : "Rainbow OFF";
      toggleRainbow.style.borderColor = rainbowEnabled ? "#21e77d" : "#2a3658";
    });

    toggleAudioSource.addEventListener("click", () => {
      usingVideoAudio = !usingVideoAudio;
      if (usingVideoAudio) {
        toggleAudioSource.textContent = "Use Uploaded Audio";
        if (audioPlayer.src) audioPlayer.pause();
        if (video.src) {
          connectSource(video);
          if (!video.paused) video.play().catch(() => {});
        }
      } else {
        toggleAudioSource.textContent = "Use Video Audio";
        if (audioPlayer.src) {
          connectSource(audioPlayer);
          audioPlayer.play().catch(() => {});
        }
      }
    });

    playBtn.addEventListener("click", async () => {
      if (!video.src) return;
      isPlaying = true;
      modeState.textContent = `Mode: ${emojiMode.value}`;
      try {
        if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume();
        await video.play();
        if (usingVideoAudio) connectSource(video);
      } catch (_) {
        modeState.textContent = "Mode: blocked by autoplay policy";
      }
    });

    exportBtn.addEventListener("click", exportFrame);

    fullscreenBtn.addEventListener("click", async () => {
      const appContainer = document.querySelector(".app-container");
      if (!document.fullscreenElement) await appContainer.requestFullscreen();
      else await document.exitFullscreen();
      resizeCanvasToDisplay();
    });

    window.addEventListener("resize", resizeCanvasToDisplay);

    requestAnimationFrame(engineLoop);
    requestAnimationFrame(drawVisualizer);
  </script>
</body>
</html>
